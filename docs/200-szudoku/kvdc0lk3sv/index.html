<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>200 szudoku · Éber elme</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--paper:#ffffff;--ink:#132a44;--ink-soft:#6b7683;--accent:#c8551b;--accent-dark:#173c62;--line:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'Open Sans',-apple-system,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.top{background:var(--accent-dark);color:var(--paper);text-align:center;padding:11px 16px;font-family:'Open Sans',Georgia,serif;font-weight:700;font-size:15px}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 56px}
.head{text-align:center;margin-bottom:22px}
.kicker{display:inline-block;background:var(--accent);color:var(--paper);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
h1{font-family:'Open Sans',Georgia,serif;font-size:clamp(26px,5vw,40px);line-height:1.15;margin-bottom:10px}
.sub{color:var(--ink-soft);font-size:17px;max-width:640px;margin:0 auto 20px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:12px;font-weight:800;font-size:16px;text-decoration:none;border:2px solid transparent}
.btn.primary{background:var(--accent);color:var(--paper);box-shadow:0 4px 0 var(--accent-dark)}
.btn.ghost{color:var(--accent-dark);border-color:var(--line);background:var(--paper)}
.viewer{margin-top:22px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}
.viewer iframe{display:block;width:100%;height:75vh;min-height:520px;border:0}
.meta{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-soft);font-size:14px}
.meta b{color:var(--ink)}
.foot{text-align:center;color:var(--ink-soft);font-size:13px;margin-top:28px}
@media (max-width:600px){.btn{width:100%}.viewer iframe{height:70vh}}
</style>
</head>
<body>
<div class="top">Éber elme</div>
<main class="wrap">
  <div class="head">
    <span class="kicker">2. bónusz (a 7-ből)</span>
    <h1>200 szudoku</h1>
    <p class="sub">Négy valódi nehézségi szint.</p>
    <div class="actions">
      <a class="btn primary" href="200-szudoku.pdf" download>PDF letöltése</a>
      <a class="btn ghost" href="200-szudoku.pdf" target="_blank" rel="noopener">Megnyitás új lapon</a>
    </div>
  </div>
  <div class="viewer">
    <iframe src="200-szudoku.pdf#view=FitH" title="200 szudoku"></iframe>
  </div>
  <div class="meta">
    <div><b>245</b> oldal</div>
    <div>Korlátlan nyomtatás</div>
  </div>
  <p class="foot">Személyes használatra és az Ön háztartása számára. A továbbértékesítés és a terjesztés tilos.</p>
</main>
</body>
</html>
