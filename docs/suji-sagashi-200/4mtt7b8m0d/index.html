<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>数字探し200問 · 冴える頭</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--paper:#ffffff;--ink:#132a44;--ink-soft:#6b7683;--accent:#c8551b;--accent-dark:#173c62;--line:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;line-break:strict;overflow-wrap:anywhere}
.top{background:var(--accent-dark);color:var(--paper);text-align:center;padding:11px 16px;font-weight:700;font-size:15px}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 56px}
.head{text-align:center;margin-bottom:22px}
.kicker{display:inline-block;background:var(--accent);color:var(--paper);padding:6px 14px;border-radius:99px;font-size:13px;font-weight:800;letter-spacing:.05em;margin-bottom:12px}
h1{font-size:clamp(26px,5vw,40px);line-height:1.3;margin-bottom:10px}
.sub{color:var(--ink-soft);font-size:17px;max-width:640px;margin:0 auto 20px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:12px;font-weight:800;font-size:16px;text-decoration:none;border:2px solid transparent}
.btn.primary{background:var(--accent);color:var(--paper);box-shadow:0 4px 0 var(--accent-dark)}
.btn.ghost{color:var(--accent-dark);border-color:var(--line);background:var(--paper)}
.viewer{margin-top:22px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}
.viewer iframe{display:block;width:100%;height:75vh;min-height:520px;border:0}
.meta{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-soft);font-size:14px}
.meta b{color:var(--ink)}
.foot{text-align:center;color:var(--ink-soft);font-size:13px;margin-top:28px}
@media (max-width:600px){.btn{width:100%}.viewer iframe{height:70vh}}
</style>
</head>
<body>
<div class="top">冴える頭</div>
<main class="wrap">
  <div class="head">
    <span class="kicker">特典 4（全7冊）</span>
    <h1>数字探し200問</h1>
    <p class="sub">似た数字の中から数を探します。</p>
    <div class="actions">
      <a class="btn primary" href="%E7%89%B9%E5%85%B8B4%20-%20%E6%95%B0%E5%AD%97%E6%8E%A2%E3%81%97200%E5%95%8F.pdf" download="特典B4 - 数字探し200問.pdf">PDFをダウンロード</a>
      <a class="btn ghost" href="%E7%89%B9%E5%85%B8B4%20-%20%E6%95%B0%E5%AD%97%E6%8E%A2%E3%81%97200%E5%95%8F.pdf" target="_blank" rel="noopener">新しいタブで開く</a>
    </div>
  </div>
  <div class="viewer">
    <iframe src="%E7%89%B9%E5%85%B8B4%20-%20%E6%95%B0%E5%AD%97%E6%8E%A2%E3%81%97200%E5%95%8F.pdf#view=FitH" title="数字探し200問"></iframe>
  </div>
  <div class="meta">
    <div><b>261</b>ページ</div>
    <div>何度でも印刷できます</div>
  </div>
  <p class="foot">ご自身とご家庭内での利用に限ります。転売・再配布は禁止です。</p>
</main>
</body>
</html>
